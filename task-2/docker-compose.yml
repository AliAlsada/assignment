---
x-defaults: &defaults
  restart: always
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

services:
  traefik:
    <<: *defaults
    image: traefik:v3.7
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --entrypoints.web.address=:80
      - --ping=true
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [proxy]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    memswap_limit: 128M
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M }
        reservations: { memory: 52M }

  db:
    <<: *defaults
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
    memswap_limit: 512M
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 512M }
        reservations: { memory: 128M }

  api:
    <<: *defaults
    build: ./api
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks: [proxy, internal]
    labels:
      traefik.enable: "true"
      traefik.http.routers.api.rule: PathPrefix(`/api`)
      traefik.http.services.api.loadbalancer.server.port: "8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
      start_interval: 2s
    memswap_limit: 256M
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }
        reservations: { memory: 64M }

  web:
    <<: *defaults
    image: nginx:1.31-alpine
    volumes:
      - ./web:/usr/share/nginx/html:ro
    networks: [proxy]
    labels:
      traefik.enable: "true"
      traefik.http.routers.web.rule: PathPrefix(`/`)
      traefik.http.services.web.loadbalancer.server.port: "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 2s
    memswap_limit: 64M
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M }
        reservations: { memory: 16M }

networks:
  proxy:
    name: proxy
  internal:
    internal: true

volumes:
  pgdata:
