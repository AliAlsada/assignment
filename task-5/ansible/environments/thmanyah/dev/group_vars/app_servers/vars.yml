---
# Firewall
baseline_firewall_allowed_ports:
  - { src: "{{ router_app_ip }}", port: "22" } # ssh

# Containers
baseline_firewall_forwarded_ports:
  - { src: "{{ lb_ip }}", dest: "any", port: "8000" } # app

# App
app_listen_address: "{{ app_ip }}"
app_listen_port: "8000"
app_vars:
  DB_HOST: "{{ db_ip }}"
  DB_PORT: "5432"
  DB_NAME: "{{ db_name }}"
  DB_USER: "{{ db_user }}"
  DB_PASSWORD: "{{ app_db_password }}"
