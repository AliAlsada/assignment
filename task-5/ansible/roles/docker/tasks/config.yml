---
- name: Docker - Create configuration directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: docker

- name: Docker - Copy configuration file
  ansible.builtin.template:
    src: "daemon.json.j2"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify:
    - Docker - Restart docker
  tags: docker
